services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sahlmart
      POSTGRES_USER: sahlmart
      POSTGRES_PASSWORD: sahlmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - '.\database\init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahlmart -d sahlmart"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
